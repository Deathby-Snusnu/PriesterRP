name: PriesterRP code and content tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python content contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua runtime smoke test
        run: lua5.4 tests/test_runtime.lua
